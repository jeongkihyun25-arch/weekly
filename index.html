<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Itinerary Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-28">

  <!-- 전국 지역 자동완성 목록 -->
  <datalist id="koreaCityList"></datalist>

  <!-- 토스트 알림 -->
  <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs sm:text-sm font-bold px-5 py-3 rounded-full shadow-xl opacity-0 pointer-events-none transition-opacity duration-200 z-[70]"></div>

  <!-- 1. 첫 화면 (홈: 일정 입력하기 / 총 스케줄 확인하기) -->
  <div id="homeScreen" class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-xl border border-slate-200/80 p-6 sm:p-8 w-full max-w-lg">
      <div class="flex justify-between items-center mb-4">
        <span class="text-xs font-extrabold uppercase tracking-wider text-blue-700 bg-blue-50 px-3 py-1 rounded-full">Product Solution · 7 Members</span>
        <button onclick="toggleLang()" class="text-xs px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-full font-bold">KO / EN</button>
      </div>

      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-1">Weekly Itinerary</h1>
      <p class="text-sm text-slate-500 mb-6" data-i18n="homeDesc">원하는 작업을 선택하세요.</p>

      <!-- 대상 주차 선택 -->
      <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3.5 mb-6">
        <label class="block text-xs font-bold text-slate-500 mb-1" data-i18n="weekSelect">대상 주차</label>
        <select id="homeWeekSelector" onchange="syncWeekSelection(this.value)" class="w-full bg-transparent text-base font-extrabold text-slate-900 focus:outline-none"></select>
      </div>

      <!-- 메인 진입 버튼 2개 -->
      <div class="grid grid-cols-1 gap-3.5">
        <button onclick="openUserSelectModal()" class="w-full p-5 rounded-2xl bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white text-left shadow-md transition">
          <div class="text-lg font-extrabold" data-i18n="homeBtnInput">일정 입력하기</div>
          <div class="text-xs text-blue-100 mt-1" data-i18n="homeBtnInputSub">본인 이름을 선택하여 월~금 주간 일정을 작성 및 저장합니다.</div>
        </button>

        <button onclick="enterScheduleView()" class="w-full p-5 rounded-2xl bg-slate-900 hover:bg-slate-800 active:scale-[0.99] text-white text-left shadow-md transition">
          <div class="text-lg font-extrabold" data-i18n="homeBtnCheck">총 스케줄 확인하기</div>
          <div class="text-xs text-slate-300 mt-1" data-i18n="homeBtnCheckSub">7명 전체 일정을 한눈에 확인하고 통합 엑셀(.xlsx)을 다운로드합니다.</div>
        </button>
      </div>
    </div>
  </div>

  <!-- 2. 사용자 선택 모달 (일정 입력하기 클릭 시 표시) -->
  <div id="userSelectModal" class="hidden fixed inset-0 bg-slate-900/75 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-3xl shadow-2xl p-6 w-full max-w-md max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-xl font-extrabold text-slate-900" data-i18n="loginTitle">이름 선택</h2>
        <button onclick="closeUserSelectModal()" class="text-xs px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg font-bold text-slate-600" data-i18n="close">닫기</button>
      </div>
      <p class="text-sm text-slate-500 mb-4" data-i18n="loginDesc">일정을 입력할 본인의 이름을 선택하세요.</p>
      <div class="grid grid-cols-2 gap-2.5" id="userButtons"></div>
    </div>
  </div>

  <!-- 3. 메인 앱 컨테이너 (입력 화면 / 스케줄 확인 화면 공용) -->
  <div id="app" class="hidden max-w-7xl mx-auto p-3 sm:p-5">
    <!-- 상단 공용 헤더 -->
    <header class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-3.5 sm:p-4 mb-4">
      <div class="flex flex-wrap justify-between items-center gap-2.5">
        <div class="flex items-center gap-2">
          <button onclick="goHome()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-extrabold" data-i18n="btnHome">
            처음으로
          </button>
          <div>
            <div class="flex items-center gap-1.5">
              <h1 class="text-base sm:text-xl font-extrabold text-slate-900" id="headerModeTitle">Weekly Itinerary</h1>
              <span id="currentUserBadge" class="hidden text-xs font-bold px-2 py-0.5 rounded-full bg-blue-600 text-white"></span>
            </div>
            <p class="text-[11px] text-slate-500" id="currentUserSub"></p>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <button id="headerSwitchBtn" onclick="toggleMainScreen()" class="px-3 py-1.5 bg-blue-50 text-blue-700 hover:bg-blue-100 rounded-lg text-xs font-extrabold"></button>
          <button onclick="toggleLang()" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-bold">KO/EN</button>
        </div>
      </div>

      <!-- 주차 선택 + 7명 제출 현황 -->
      <div class="mt-3 pt-3 border-t border-slate-100 flex flex-wrap justify-between items-center gap-2.5">
        <div class="flex items-center gap-2 bg-slate-100 px-3 py-2 rounded-xl flex-1 sm:flex-initial">
          <span class="text-xs font-bold text-slate-500 shrink-0" data-i18n="weekSelect">주차:</span>
          <select id="weekSelector" onchange="syncWeekSelection(this.value)" class="bg-transparent text-xs sm:text-sm font-extrabold text-slate-900 focus:outline-none w-full"></select>
        </div>

        <div class="flex items-center gap-1 flex-wrap" id="submissionSummaryBar"></div>
      </div>
    </header>

    <!-- [화면 A] 내 일정 입력 (하루 4개 기본 고정) -->
    <div id="inputScreen" class="hidden space-y-4">
      <!-- 코드 기준표 + 빠른 도구 -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-3.5 flex flex-wrap justify-between items-center gap-3">
        <div class="flex flex-wrap gap-1.5" id="topCodeGuide"></div>
        <div class="flex items-center gap-2">
          <button onclick="openUserSelectModal()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold" data-i18n="switchUser">
            이름 변경
          </button>
          <button onclick="copyFromLastWeek()" class="px-3 py-1.5 bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 rounded-lg text-xs font-bold" data-i18n="btnCopyLastWeek">
            지난주 불러오기
          </button>
          <button onclick="clearMyWeek()" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg text-xs font-bold" data-i18n="btnClear">
            전체 비우기
          </button>
        </div>
      </div>

      <!-- 월~금 5일 x 4개 슬롯 카드 -->
      <div id="dayCardsContainer" class="space-y-4"></div>

      <!-- 페이지 최하단 대형 저장 버튼 -->
      <div class="pt-2">
        <button onclick="saveMyData()" class="w-full py-4 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-extrabold text-base rounded-2xl shadow-lg transition" data-i18n="btnSaveBig">
          작성한 주간 일정 저장하기
        </button>
      </div>
    </div>

    <!-- [화면 B] 총 스케줄 확인하기 -->
    <div id="scheduleScreen" class="hidden space-y-4">
      <!-- 보기 모드 선택 + 전체화면 + 엑셀 다운로드 -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-3.5 flex flex-wrap justify-between items-center gap-3">
        <div class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl w-full sm:w-auto">
          <button id="subTabMobile" onclick="switchScheduleMode('mobile')" class="px-3 py-2 rounded-lg text-xs font-extrabold transition" data-i18n="modeMobile">
            요일별 카드
          </button>
          <button id="subTabMatrix" onclick="switchScheduleMode('matrix')" class="px-3 py-2 rounded-lg text-xs font-extrabold transition" data-i18n="modeMatrix">
            7명 전체표
          </button>
          <button id="subTabSheet" onclick="switchScheduleMode('sheet')" class="px-3 py-2 rounded-lg text-xs font-extrabold transition" data-i18n="modeSheet">
            개별 시트
          </button>
        </div>

        <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
          <button onclick="toggleFullscreenSchedule()" id="btnFullscreen" class="flex-1 sm:flex-initial px-3.5 py-2.5 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-extrabold transition" data-i18n="btnFullscreen">
            전체화면 보기
          </button>
          <button onclick="downloadExcel()" class="flex-1 sm:flex-initial px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-extrabold shadow-sm transition" data-i18n="btnDownload">
            7명 통합 엑셀 (.xlsx)
          </button>
        </div>
      </div>

      <!-- 전체화면 확장 가능 컨테이너 -->
      <div id="scheduleFullscreenContainer" class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-3.5 sm:p-5">
        <!-- 전체화면일 때만 보이는 상단 닫기 바 -->
        <div id="fullscreenTopBar" class="hidden flex justify-between items-center pb-3 mb-3 border-b border-slate-200">
          <div>
            <h2 class="text-base font-extrabold text-slate-900" id="fullscreenTitle">Weekly Schedule (7 Members)</h2>
            <p class="text-xs text-slate-500" id="fullscreenPeriod"></p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="downloadExcel()" class="px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-bold">Excel</button>
            <button onclick="toggleFullscreenSchedule()" class="px-3 py-1.5 bg-slate-900 text-white rounded-lg text-xs font-bold" data-i18n="exitFullscreen">전체화면 닫기</button>
          </div>
        </div>

        <!-- 코드 필터 바 (요일별 카드 / 7명 전체표 공용) -->
        <div id="scheduleFilterBar" class="flex flex-wrap justify-between items-center gap-2 mb-4">
          <div class="text-xs font-bold text-slate-500" id="schedulePeriodLabel"></div>
          <div class="flex items-center gap-1 flex-wrap" id="matrixCodeFilter"></div>
        </div>

        <!-- [보기 1] 모바일 최적화 요일별 카드 보기 (요일 선택 탭 + 7명 세로 카드) -->
        <div id="modeViewMobile" class="hidden space-y-3">
          <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1" id="mobileDayTabs"></div>
          <div id="mobileDayCards" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
        </div>

        <!-- [보기 2] 7명 전체 매트릭스 표 -->
        <div id="modeViewMatrix" class="hidden overflow-x-auto border border-slate-200 rounded-xl">
          <table class="w-full border-collapse text-xs min-w-[1050px]">
            <thead>
              <tr class="bg-slate-100 text-slate-700" id="matrixTableHead"></tr>
            </thead>
            <tbody id="matrixTableBody"></tbody>
          </table>
        </div>

        <!-- [보기 3] 개별 시트 (원본 엑셀 1번 양식) -->
        <div id="modeViewSheet" class="hidden space-y-3">
          <div class="flex gap-1.5 flex-wrap" id="sheetTabs"></div>
          <div class="border border-slate-200 rounded-xl p-3 bg-slate-50 overflow-x-auto">
            <div class="mb-2.5 flex justify-between items-center">
              <span class="font-extrabold text-sm sm:text-base text-slate-800" id="previewSheetHeader">Sheet: JKH</span>
              <span id="previewStatusBadge" class="text-xs px-2.5 py-1 rounded-full font-bold"></span>
            </div>
            <table class="w-full border-collapse border border-slate-300 bg-white text-xs sm:text-sm min-w-[540px]">
              <thead>
                <tr class="bg-slate-100 text-slate-700">
                  <th class="border border-slate-300 p-2 w-28">Date</th>
                  <th class="border border-slate-300 p-2 w-12">No.</th>
                  <th class="border border-slate-300 p-2 w-32">City</th>
                  <th class="border border-slate-300 p-2 w-24">Code</th>
                  <th class="border border-slate-300 p-2">Activity / Details</th>
                </tr>
              </thead>
              <tbody id="previewTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 하단 고정 대형 저장 바 (입력 화면 전용) -->
  <div id="floatingSaveBar" class="hidden fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur border-t-2 border-blue-200 p-3 shadow-[0_-4px_20px_rgba(0,0,0,0.08)] z-40">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
      <div class="text-xs sm:text-sm text-slate-600 shrink-0">
        <span class="font-extrabold text-blue-600" id="filledCountText">0</span> / 20
        <span class="hidden sm:inline" data-i18n="itemsFilled">항목 입력됨 (빈칸 저장 가능)</span>
      </div>
      <button onclick="saveMyData()" id="btnSave" class="flex-1 sm:flex-initial sm:min-w-[220px] py-3 px-6 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-extrabold rounded-xl text-sm sm:text-base shadow-md transition" data-i18n="btnSave">
        저장하기
      </button>
    </div>
  </div>

function escapeHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function showToast(msg) {
  const el = document.getElementById("toast");
  el.innerText = msg;
  el.classList.remove("opacity-0");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.add("opacity-0"), 2200);
}

function initWeekOptions() {
  const today = new Date();
  const day = today.getDay();
  const diffToMon = (day === 0 ? -6 : 1 - day);
  const thisMonday = new Date(today);
  thisMonday.setDate(today.getDate() + diffToMon);

  const offsets = [-7, 0, 7, 14];
  const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  weekOptions = offsets.map(offset => {
    const mon = new Date(thisMonday);
    mon.setDate(thisMonday.getDate() + offset);
    const fri = new Date(mon);
    fri.setDate(mon.getDate() + 4);

    const periodStr = `${mon.getDate()}${monthNames[mon.getMonth()]}-${fri.getDate()}${monthNames[fri.getMonth()]} ${fri.getFullYear()}`;
    const key = mon.toISOString().slice(0, 10);

    const days = [];
    for (let i = 0; i < 5; i++) {
      const d = new Date(mon);
      d.setDate(mon.getDate() + i);
      days.push(`${d.getMonth() + 1}/${d.getDate()} (${dayNames[d.getDay()]})`);
    }
    return { key, periodStr, days, isNextWeek: offset === 7 };
  });

  const nextWeek = weekOptions.find(w => w.isNextWeek) || weekOptions[0];
  selectedWeekKey = nextWeek.key;

  const optionsHtml = weekOptions.map(w => `
    <option value="${w.key}" ${w.key === selectedWeekKey ? "selected" : ""}>
      ${w.periodStr} ${w.isNextWeek ? "(Next Week)" : ""}
    </option>
  `).join("");

  document.getElementById("homeWeekSelector").innerHTML = optionsHtml;
  document.getElementById("weekSelector").innerHTML = optionsHtml;
}

function getSelectedWeekObj() {

async function loadWeekData() {
  const weekObj = getSelectedWeekObj();
  allWeekData = {};

  const localCache = localStorage.getItem(`weekly_${weekObj.key}`);
  if (localCache) allWeekData = JSON.parse(localCache);

  if (SCRIPT_URL && SCRIPT_URL.startsWith("http")) {
    try {
      const res = await fetch(`${SCRIPT_URL}?week=${weekObj.key}`);
      const serverData = await res.json();
      allWeekData = { ...allWeekData, ...serverData };
      localStorage.setItem(`weekly_${weekObj.key}`, JSON.stringify(allWeekData));
    } catch (e) {
      console.warn("Server fetch skipped:", e);
    }
  }

  if (currentUser) {
    const saved = allWeekData[currentUser.code] || [];
    currentRows = Array.from({ length: 20 }, (_, i) => {
      const dIdx = Math.floor(i / 4);
      return saved[i] || { date: weekObj.days[dIdx], no: (i % 4) + 1, city: "", code: "", detail: "" };
    });
    renderDayCards();
  }

  renderSubmissionSummary();
  renderScheduleViews();
}

function autoSaveLocal() {
  if (!currentUser) return;
  const weekObj = getSelectedWeekObj();
  allWeekData[currentUser.code] = currentRows;
  localStorage.setItem(`weekly_${weekObj.key}`, JSON.stringify(allWeekData));
  renderSubmissionSummary();
}

function selectCode(rowIdx, code) {
  const isTurningOn = currentRows[rowIdx].code !== code;
  currentRows[rowIdx].code = isTurningOn ? code : "";

  if (isTurningOn && code === "E" && !currentRows[rowIdx].detail) {
    currentRows[rowIdx].detail = "Move to ";
  }

  autoSaveLocal();
  renderDayCards();

  if (isTurningOn && code === "E") {
    focusInputEnd(`detail_${rowIdx}`);
  }
}

function setCity(rowIdx, city) {
  currentRows[rowIdx].city = city;
  if (city === "BSTK" && !currentRows[rowIdx].code) {
    currentRows[rowIdx].code = "A";
  }
  autoSaveLocal();
  renderDayCards();
}

function setDetail(rowIdx, text) {
  currentRows[rowIdx].detail = text;
  autoSaveLocal();
  renderDayCards();
  if (text.endsWith(" ")) {
    focusInputEnd(`detail_${rowIdx}`);
  }
}

function focusInputEnd(elId) {
  const input = document.getElementById(elId);
  if (input) {
    input.focus();
    const len = input.value.length;
    input.setSelectionRange(len, len);
  }
}

function updateField(rowIdx, field, val) {
  currentRows[rowIdx][field] = val;
  updateFilledCount();
  autoSaveLocal();
}

function clearSingleRow(rowIdx) {
  currentRows[rowIdx].city = "";
  currentRows[rowIdx].code = "";
  currentRows[rowIdx].detail = "";
  autoSaveLocal();
  renderDayCards();
}

function copyPreviousDay(dIdx) {
  const weekObj = getSelectedWeekObj();
  for (let s = 0; s < 4; s++) {
    const prev = currentRows[(dIdx - 1) * 4 + s];
    currentRows[dIdx * 4 + s] = {
      date: weekObj.days[dIdx],
      no: s + 1,
      city: prev.city,
      code: prev.code,
      detail: prev.detail
    };
  }
  autoSaveLocal();
  renderDayCards();
  showToast(currentLang === "ko" ? "전일 일정을 복사했습니다." : "Copied from previous day.");
}

function copyFromLastWeek() {
  if (!currentUser) return;
  const curIdx = weekOptions.findIndex(w => w.key === selectedWeekKey);
  if (curIdx <= 0) return;

  const prevWeekKey = weekOptions[curIdx - 1].key;
  const prevCache = localStorage.getItem(`weekly_${prevWeekKey}`);
  if (!prevCache) {
    showToast(currentLang === "ko" ? "저장된 지난주 데이터가 없습니다." : "No data from last week.");
    return;
  }

  const parsed = JSON.parse(prevCache);
  const prevRows = parsed[currentUser.code];
  if (!prevRows) return;

  const weekObj = getSelectedWeekObj();
  currentRows = prevRows.map((r, i) => ({
    ...r,
    date: weekObj.days[Math.floor(i / 4)]
  }));
  autoSaveLocal();
  renderDayCards();
  showToast(currentLang === "ko" ? "지난주 일정을 불러왔습니다." : "Imported last week's plan.");
}

function clearMyWeek() {
  if (!currentUser) return;
  const weekObj = getSelectedWeekObj();
  currentRows = Array.from({ length: 20 }, (_, i) => ({
    date: weekObj.days[Math.floor(i / 4)],
    no: (i % 4) + 1,
    city: "",
    code: "",
    detail: ""
  }));
  autoSaveLocal();
  renderDayCards();
  showToast(currentLang === "ko" ? "현재 주차 일정을 비웠습니다." : "Cleared current week.");
}

function updateFilledCount() {
  const count = currentRows.filter(r => r.city || r.code || r.detail).length;
  document.getElementById("filledCountText").innerText = count;
}

async function saveMyData() {
  if (!currentUser) return;
  const weekObj = getSelectedWeekObj();
  allWeekData[currentUser.code] = currentRows;
  localStorage.setItem(`weekly_${weekObj.key}`, JSON.stringify(allWeekData));

  const btn = document.getElementById("btnSave");
  btn.disabled = true;
  btn.innerText = "Saving...";

  if (SCRIPT_URL && SCRIPT_URL.startsWith("http")) {
    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ week: weekObj.key, user: currentUser.code, rows: currentRows })
      });
    } catch (e) {
      console.error(e);
    }
  }

  btn.disabled = false;
  btn.innerText = I18N[currentLang].btnSave;
  renderSubmissionSummary();
  showToast(I18N[currentLang].savedToast);
}

    container.className = "bg-white rounded-2xl shadow-sm border border-slate-200/80 p-3.5 sm:p-5";
    topBar.classList.add("hidden");
    document.body.classList.remove("overflow-hidden");
  }
}

function renderScheduleViews() {
  const weekObj = getSelectedWeekObj();
  document.getElementById("schedulePeriodLabel").innerText = weekObj.periodStr;
  renderCodeFilterBar();
  renderMobileDayView();
  renderMatrixView();
  renderOverviewTabs();
}

function renderCodeFilterBar() {
  document.getElementById("matrixCodeFilter").innerHTML = `
    <button onclick="setMatrixFilter('ALL')"
      class="px-2.5 py-1 rounded-lg text-xs font-bold border ${matrixFilterCode === "ALL" ? "bg-slate-900 text-white border-slate-900" : "bg-white text-slate-600 border-slate-200"}">
      ${I18N[currentLang].filterAll}
    </button>
    ${ACTIVITY_CODES.map(c => `
      <button onclick="setMatrixFilter('${c.code}')"
        class="px-2 py-1 rounded-lg text-xs font-bold border ${matrixFilterCode === c.code ? c.color : "bg-white text-slate-600 border-slate-200 hover:bg-slate-50"}">
        ${c.code}
      </button>
    `).join("")}
  `;
}

function setMatrixFilter(code) {
  matrixFilterCode = code;
  renderScheduleViews();
}

// [보기 1] 모바일 최적화 요일별 카드 (선택한 요일의 7명 일정 1~4번 표시)
function renderMobileDayView() {
  const weekObj = getSelectedWeekObj();
  document.getElementById("mobileDayTabs").innerHTML = weekObj.days.map((d, idx) => `
    <button onclick="selectMobileDay(${idx})"
      class="px-3.5 py-2 rounded-xl text-xs font-extrabold border shrink-0 transition
      ${selectedMobileDayIdx === idx ? "bg-blue-600 text-white border-blue-600 shadow-xs" : "bg-slate-50 text-slate-600 border-slate-200"}">
      ${d}
    </button>
  `).join("");

  document.getElementById("mobileDayCards").innerHTML = MEMBERS.map(m => {
    const dayRows = (allWeekData[m.code] || []).slice(selectedMobileDayIdx * 4, selectedMobileDayIdx * 4 + 4);
    const hasAny = dayRows.some(r => r.city || r.code || r.detail);

    const slotsHtml = [0, 1, 2, 3].map(slotIdx => {
      const r = dayRows[slotIdx] || { city: "", code: "", detail: "" };
      const filled = r.city || r.code || r.detail;
      if (matrixFilterCode !== "ALL" && r.code !== matrixFilterCode) return "";

      const codeObj = ACTIVITY_CODES.find(c => c.code === r.code);
      const badgeClass = codeObj ? codeObj.light : "bg-slate-100 text-slate-500 border-slate-200";

      return `
        <div class="flex items-start gap-2 py-1.5 border-b border-slate-100 last:border-0 text-xs">
          <span class="w-5 text-center font-bold text-slate-400 shrink-0">${slotIdx + 1}</span>
          ${filled ? `
            <span class="px-1.5 py-0.5 rounded border text-[10px] font-extrabold shrink-0 ${badgeClass}">${escapeHtml(r.code || "-")}</span>
            <div class="flex-1 min-w-0">
              <span class="font-bold text-slate-800 mr-1.5">${escapeHtml(r.city)}</span>
              <span class="text-slate-600 break-words">${escapeHtml(r.detail)}</span>
            </div>
          ` : `<span class="text-slate-300">-</span>`}
        </div>
      `;
    }).join("");

    return `
      <div class="border border-slate-200 rounded-xl p-3 bg-slate-50/40">
        <div class="flex items-center justify-between mb-2 pb-1.5 border-b border-slate-200">
          <div class="font-extrabold text-sm text-slate-900">${m.ko} <span class="text-xs font-normal text-slate-500">(${m.en})</span></div>
          <span class="text-[11px] px-2 py-0.5 rounded-full font-bold ${hasAny ? "bg-emerald-100 text-emerald-700" : "bg-slate-200 text-slate-500"}">${m.code}</span>
        </div>
        <div>${slotsHtml || '<div class="text-xs text-slate-300 py-2 text-center">-</div>'}</div>
      </div>
    `;
  }).join("");
}

function selectMobileDay(idx) {
  selectedMobileDayIdx = idx;
  renderMobileDayView();
}

// [보기 2] 7명 전체 매트릭스 표
function renderMatrixView() {
  const weekObj = getSelectedWeekObj();
  document.getElementById("matrixTableHead").innerHTML = `
    <th class="border-b border-r border-slate-200 p-2.5 w-24 text-center bg-slate-100 sticky left-0 z-10">Date</th>
    ${MEMBERS.map(m => {
      const rows = allWeekData[m.code] || [];
      const hasData = rows.some(r => r.city || r.code || r.detail);
      return `
        <th class="border-b border-r border-slate-200 p-2.5 text-left min-w-[140px]">
          <div class="flex items-center justify-between gap-1">
            <span class="font-extrabold text-slate-900">${m.ko}</span>
            <span class="text-[10px] px-1.5 py-0.5 rounded font-bold ${hasData ? "bg-emerald-100 text-emerald-700" : "bg-slate-200 text-slate-500"}">${m.code}</span>
          </div>
        </th>
      `;
    }).join("")}
  `;

  document.getElementById("matrixTableBody").innerHTML = weekObj.days.map((dayStr, dIdx) => {
    const memberCells = MEMBERS.map(m => {
      const rows = (allWeekData[m.code] || []).slice(dIdx * 4, dIdx * 4 + 4);
      const validRows = rows.filter(r => {
        const filled = r.city || r.code || r.detail;
        if (!filled) return false;
        if (matrixFilterCode !== "ALL" && r.code !== matrixFilterCode) return false;
        return true;
      });

      if (validRows.length === 0) {
        return `<td class="border-b border-r border-slate-200 p-2 align-top text-slate-300 text-center">-</td>`;
      }

      const itemsHtml = validRows.map(r => {
        const codeObj = ACTIVITY_CODES.find(c => c.code === r.code);
        const badgeClass = codeObj ? codeObj.light : "bg-slate-100 text-slate-600 border-slate-200";
        return `
          <div class="p-1.5 rounded-lg border ${badgeClass} mb-1.5 last:mb-0">
            <div class="flex items-center justify-between gap-1 mb-0.5">
              <span class="font-extrabold text-[10px]">${escapeHtml(r.code || "-")}</span>
              <span class="font-bold text-[10px] opacity-80 truncate">${escapeHtml(r.city)}</span>
            </div>
            <div class="text-[11px] leading-snug text-slate-800 break-words">${escapeHtml(r.detail)}</div>
          </div>
        `;
      }).join("");

      return `<td class="border-b border-r border-slate-200 p-2 align-top bg-white">${itemsHtml}</td>`;
    }).join("");

    return `
      <tr>
        <td class="border-b border-r border-slate-200 p-2.5 text-center font-extrabold text-slate-700 bg-slate-50 sticky left-0 align-top">
          ${dayStr}
        </td>
        ${memberCells}
      </tr>
    `;
  }).join("");
}

// [보기 3] 개별 시트 보기
function renderOverviewTabs() {
  document.getElementById("sheetTabs").innerHTML = MEMBERS.map(m => {
    const hasData = (allWeekData[m.code] || []).some(r => r.city || r.code || r.detail);
    const active = selectedPreviewCode === m.code;
    return `
      <button onclick="selectPreviewSheet('${m.code}')"
        class="px-3 py-1.5 rounded-xl text-xs font-extrabold border transition flex items-center gap-1.5
        ${active ? "bg-slate-900 text-white border-slate-900" : "bg-white text-slate-700 border-slate-300 hover:bg-slate-100"}">
        <span>${m.code} (${m.ko})</span>
        <span class="w-2 h-2 rounded-full ${hasData ? "bg-emerald-400" : "bg-slate-300"}"></span>
      </button>
    `;
  }).join("");
  renderPreviewTable();
}

function selectPreviewSheet(code) {
  selectedPreviewCode = code;
  renderOverviewTabs();
}

function renderPreviewTable() {
  const weekObj = getSelectedWeekObj();
  const member = MEMBERS.find(m => m.code === selectedPreviewCode) || MEMBERS[0];
  const rows = allWeekData[member.code] || [];
  const hasData = rows.some(r => r.city || r.code || r.detail);

  document.getElementById("previewSheetHeader").innerText = `Sheet: ${member.code} (${member.en})`;
  const badge = document.getElementById("previewStatusBadge");
  badge.innerText = hasData ? I18N[currentLang].statusDone : I18N[currentLang].statusEmpty;
  badge.className = hasData
    ? "text-xs px-2.5 py-1 rounded-full font-bold bg-emerald-100 text-emerald-700"
    : "text-xs px-2.5 py-1 rounded-full font-bold bg-slate-200 text-slate-600";

  let html = "";
  weekObj.days.forEach((dayStr, dIdx) => {
    for (let no = 1; no <= 4; no++) {
      const idx = dIdx * 4 + (no - 1);
      const r = rows[idx] || { city: "", code: "", detail: "" };
      html += `<tr>`;
      if (no === 1) {
        html += `<td rowspan="4" class="border border-slate-300 p-2 text-center font-bold bg-slate-50">${dayStr}</td>`;
      }
      html += `
        <td class="border border-slate-300 p-1.5 text-center">${no}</td>
        <td class="border border-slate-300 p-1.5 text-center">${escapeHtml(r.city)}</td>
        <td class="border border-slate-300 p-1.5 text-center font-bold text-blue-700">${escapeHtml(r.code)}</td>
        <td class="border border-slate-300 p-1.5">${escapeHtml(r.detail)}</td>
      </tr>`;
    }
  });
  document.getElementById("previewTableBody").innerHTML = html;
}

// 7명 시트 통합 엑셀 다운로드 (빈칸 포함 1~4번 구조 유지)
function downloadExcel() {
  const weekObj = getSelectedWeekObj();
  if (currentUser) {
    allWeekData[currentUser.code] = currentRows;
  }
  const wb = XLSX.utils.book_new();

  MEMBERS.forEach(member => {
    const userRows = allWeekData[member.code] || [];
    const sheetData = [];

    sheetData.push(["Weekly Itinerary", "", "", "", "", ""]);
    sheetData.push(["Period", "", weekObj.periodStr, "", "Team", "Product Solution"]);
    sheetData.push([]);
    sheetData.push(["Date", "No.", "City", "Activity Code", "Activity / Details"]);

    weekObj.days.forEach((dayStr, dIdx) => {
      for (let no = 1; no <= 4; no++) {
        const idx = dIdx * 4 + (no - 1);
        const r = userRows[idx] || { city: "", code: "", detail: "" };
        sheetData.push([
          no === 1 ? dayStr : "",
          no,
          r.city || "",
          r.code || "",
          r.detail || ""
        ]);
      }
    });

    sheetData.push([]);
    sheetData.push(["Activity Code", "", "", "", ""]);
    sheetData.push(["Activity", "", "", "Code", ""]);
    ACTIVITY_CODES.forEach(c => {
      sheetData.push([c.label, "", "", c.code, ""]);
    });

    const ws = XLSX.utils.aoa_to_sheet(sheetData);
    ws["!merges"] = [
      { s: { r: 0, c: 0 }, e: { r: 0, c: 4 } },
      { s: { r: 1, c: 0 }, e: { r: 1, c: 1 } },
      { s: { r: 4, c: 0 }, e: { r: 7, c: 0 } },
      { s: { r: 8, c: 0 }, e: { r: 11, c: 0 } },
      { s: { r: 12, c: 0 }, e: { r: 15, c: 0 } },
      { s: { r: 16, c: 0 }, e: { r: 19, c: 0 } },
      { s: { r: 20, c: 0 }, e: { r: 23, c: 0 } }
    ];
    ws["!cols"] = [
      { wch: 15 },
      { wch: 6 },
      { wch: 18 },
      { wch: 15 },
      { wch: 42 }
    ];

    XLSX.utils.book_append_sheet(wb, ws, member.code);
  });

  XLSX.writeFile(wb, `Weekly_Plan_${weekObj.key}.xlsx`);
  showToast(currentLang === "ko" ? "7명 통합 엑셀 파일이 다운로드되었습니다." : "Excel file downloaded.");
}
</script>
