function escapeHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function showToast(msg) {
  const el = document.getElementById("toast");
  el.innerText = msg;
  el.classList.remove("opacity-0");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.add("opacity-0"), 2200);
}

function initWeekOptions() {
  const select = document.getElementById("weekSelector");
  const today = new Date();
  const day = today.getDay();
  const diffToMon = (day === 0 ? -6 : 1 - day);
  const thisMonday = new Date(today);
  thisMonday.setDate(today.getDate() + diffToMon);

  const offsets = [-7, 0, 7, 14];
  const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  weekOptions = offsets.map(offset => {
    const mon = new Date(thisMonday);
    mon.setDate(thisMonday.getDate() + offset);
    const fri = new Date(mon);
    fri.setDate(mon.getDate() + 4);

    const periodStr = `${mon.getDate()}${monthNames[mon.getMonth()]}-${fri.getDate()}${monthNames[fri.getMonth()]} ${fri.getFullYear()}`;
    const key = mon.toISOString().slice(0, 10);

    const days = [];
    for (let i = 0; i < 5; i++) {
      const d = new Date(mon);
      d.setDate(mon.getDate() + i);
      days.push(`${d.getMonth() + 1}/${d.getDate()} (${dayNames[d.getDay()]})`);
    }
    return { key, periodStr, days, isNextWeek: offset === 7 };
  });

  select.innerHTML = weekOptions.map(w => `
    <option value="${w.key}" ${w.isNextWeek ? "selected" : ""}>
      ${w.periodStr} ${w.isNextWeek ? "(Next Week)" : ""}
    </option>
  `).join("");
}

function login(code) {
  currentUser = MEMBERS.find(m => m.code === code);
  selectedPreviewCode = code;
  document.getElementById("loginModal").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("floatingSaveBar").classList.remove("hidden");
  document.getElementById("currentUserBadge").innerText = currentUser.code;
  document.getElementById("currentUserSub").innerText = `${currentUser.ko} (${currentUser.en})`;
  loadWeekData();
}

function logout() {
  document.getElementById("loginModal").classList.remove("hidden");
  document.getElementById("app").classList.add("hidden");
  document.getElementById("floatingSaveBar").classList.add("hidden");
}

function toggleLang() {
  currentLang = currentLang === "ko" ? "en" : "ko";
  applyLanguage();
}

function applyLanguage() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (I18N[currentLang][key]) el.innerText = I18N[currentLang][key];
  });
  if (currentUser) {
    renderDayCards();
    renderMatrixView();
    renderPreviewTable();
    renderSubmissionSummary();
  }
}

function switchTab(tab) {
  const views = { input: "viewInput", matrix: "viewMatrix", overview: "viewOverview" };
  const tabs = { input: "tabInput", matrix: "tabMatrix", overview: "tabOverview" };

  Object.keys(views).forEach(k => {
    document.getElementById(views[k]).classList.toggle("hidden", k !== tab);
    document.getElementById(tabs[k]).className = k === tab
      ? "py-2.5 px-2 rounded-lg font-bold text-xs sm:text-sm bg-white text-blue-600 shadow-sm transition"
      : "py-2.5 px-2 rounded-lg font-bold text-xs sm:text-sm text-slate-600 hover:text-slate-900 transition";
  });

  document.getElementById("floatingSaveBar").classList.toggle("hidden", tab !== "input");

  allWeekData[currentUser.code] = currentRows;
  if (tab === "matrix") renderMatrixView();
  if (tab === "overview") renderOverviewTabs();
}

function getSelectedWeekObj() {
  const key = document.getElementById("weekSelector").value;
  return weekOptions.find(w => w.key === key);
}

function renderTopCodeGuide() {
  document.getElementById("topCodeGuide").innerHTML = ACTIVITY_CODES.map(c => `
    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md border text-[11px] ${c.light}">
      <strong class="font-extrabold">${c.code}</strong>
      <span>${c.ko}</span>
    </span>
  `).join("");
}

function renderSubmissionSummary() {
  const bar = document.getElementById("submissionSummaryBar");
  let doneCount = 0;
  const badges = MEMBERS.map(m => {
    const rows = m.code === currentUser?.code ? currentRows : (allWeekData[m.code] || []);
    const hasData = rows.some(r => r.city || r.code || r.detail);
    if (hasData) doneCount++;
    return `
      <button onclick="openMemberSheet('${m.code}')" title="${m.ko} (${m.en})"
        class="px-2 py-1 rounded-lg text-[11px] font-bold border transition flex items-center gap-1
        ${hasData ? "bg-emerald-50 text-emerald-700 border-emerald-200" : "bg-slate-50 text-slate-400 border-slate-200"}">
        <span class="w-1.5 h-1.5 rounded-full ${hasData ? "bg-emerald-500" : "bg-slate-300"}"></span>
        ${m.code}
      </button>
    `;
  }).join("");

  bar.innerHTML = `<span class="text-xs font-extrabold text-slate-700 mr-1">${doneCount}/6</span>` + badges;
}

function openMemberSheet(code) {
  selectedPreviewCode = code;
  switchTab("overview");
}

async function loadWeekData() {
  const weekObj = getSelectedWeekObj();
  allWeekData = {};

  const localCache = localStorage.getItem(`weekly_${weekObj.key}`);
  if (localCache) allWeekData = JSON.parse(localCache);

  if (SCRIPT_URL && SCRIPT_URL.startsWith("http")) {
    try {
      const res = await fetch(`${SCRIPT_URL}?week=${weekObj.key}`);
      const serverData = await res.json();
      allWeekData = { ...allWeekData, ...serverData };
      localStorage.setItem(`weekly_${weekObj.key}`, JSON.stringify(allWeekData));
    } catch (e) {
      console.warn("Server fetch skipped:", e);
    }
  }

  const saved = allWeekData[currentUser.code] || [];
  currentRows = Array.from({ length: 20 }, (_, i) => {
    const dIdx = Math.floor(i / 4);
    return saved[i] || { date: weekObj.days[dIdx], no: (i % 4) + 1, city: "", code: "", detail: "" };
  });

  renderSubmissionSummary();
  renderDayCards();
  renderMatrixView();
  renderOverviewTabs();
}

function autoSaveLocal() {
  const weekObj = getSelectedWeekObj();
  allWeekData[currentUser.code] = currentRows;
  localStorage.setItem(`weekly_${weekObj.key}`, JSON.stringify(allWeekData));
  renderSubmissionSummary();
}

function renderDayCards() {
  const weekObj = getSelectedWeekObj();
  const container = document.getElementById("dayCardsContainer");

  container.innerHTML = weekObj.days.map((dayStr, dIdx) => {
    const dayRows = currentRows.slice(dIdx * 4, dIdx * 4 + 4);
    const visibleCount = Math.max(2, dayRows.reduce((max, r, idx) => (r.city || r.code || r.detail ? idx + 1 : max), 0));

    let rowsHtml = "";
    for (let slot = 0; slot < 4; slot++) {
      const rowIdx = dIdx * 4 + slot;
      const r = currentRows[rowIdx];
      const codeObj = ACTIVITY_CODES.find(c => c.code === r.code);
      const isHidden = slot >= visibleCount;

      rowsHtml += `
        <div id="slot_${rowIdx}" class="${isHidden ? "hidden" : ""} p-3 rounded-xl border ${r.code ? "border-blue-200 bg-blue-50/20" : "border-slate-200 bg-slate-50/60"} space-y-2.5">
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-1.5">
              <span class="text-xs font-extrabold text-slate-500 bg-white border border-slate-200 px-2 py-0.5 rounded-md">#${slot + 1}</span>
              ${(r.city || r.code || r.detail) ? `
                <button type="button" onclick="clearSingleRow(${rowIdx})" title="항목 비우기"
                  class="text-xs text-slate-400 hover:text-rose-600 px-1.5 py-0.5 rounded hover:bg-rose-50 font-bold">×</button>
              ` : ""}
            </div>
            <div class="flex items-center gap-1 overflow-x-auto no-scrollbar py-0.5">
              ${ACTIVITY_CODES.map(c => {
                const active = r.code === c.code;
                return `
                  <button type="button" onclick="selectCode(${rowIdx}, '${c.code}')"
                    class="px-2 py-1 rounded-lg text-xs font-extrabold border transition shrink-0
                    ${active ? c.color + " shadow-xs scale-105" : "bg-white text-slate-600 border-slate-200 hover:bg-slate-100"}">
                    ${c.code}
                  </button>
                `;
              }).join("")}
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-12 gap-2">
            <div class="sm:col-span-4">
              <input type="text" id="city_${rowIdx}" list="koreaCityList" value="${escapeHtml(r.city)}"
                oninput="updateField(${rowIdx}, 'city', this.value)"
                placeholder="City (전국 지명 검색/선택)"
                class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:border-blue-500 focus:outline-none font-medium" />
              <div class="flex gap-1 overflow-x-auto no-scrollbar mt-1">
                ${QUICK_CITIES.map(city => `
                  <button type="button" onclick="setCity(${rowIdx}, '${city}')"
                    class="px-2 py-0.5 text-[11px] bg-white border border-slate-200 hover:border-blue-400 hover:text-blue-600 rounded text-slate-500 shrink-0">
                    ${city}
                  </button>
                `).join("")}
              </div>
            </div>

            <div class="sm:col-span-8">
              <input type="text" id="detail_${rowIdx}" value="${escapeHtml(r.detail)}"
                oninput="updateField(${rowIdx}, 'detail', this.value)"
                placeholder="Activity / Details"
                class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:border-blue-500 focus:outline-none" />
              <div class="flex gap-1 overflow-x-auto no-scrollbar mt-1">
                ${(codeObj ? codeObj.presets : ["Preparation", "S&R task", "Meeting", "Dealer visit"]).map(preset => `
                  <button type="button" onclick="setDetail(${rowIdx}, '${preset}')"
                    class="px-2 py-0.5 text-[11px] bg-blue-50/80 border border-blue-200 hover:bg-blue-100 rounded text-blue-700 shrink-0">
                    + ${preset}
                  </button>
                `).join("")}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    return `
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4">
        <div class="flex justify-between items-center mb-3">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
            <h3 class="font-extrabold text-base text-slate-900">${dayStr}</h3>
          </div>
          <div class="flex items-center gap-2">
            ${dIdx > 0 ? `
              <button type="button" onclick="copyPreviousDay(${dIdx})"
                class="text-xs px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg font-bold">
                ${I18N[currentLang].copyPrevDay}
              </button>
            ` : ""}
            ${visibleCount < 4 ? `
              <button type="button" onclick="expandDaySlots(${dIdx})"
                class="text-xs px-2.5 py-1 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-lg font-bold">
                ${I18N[currentLang].addSlot}
              </button>
            ` : ""}
          </div>
        </div>
        <div class="space-y-2.5">${rowsHtml}</div>
      </div>
    `;
  }).join("");

  updateFilledCount();
}

function selectCode(rowIdx, code) {
  const isTurningOn = currentRows[rowIdx].code !== code;
  currentRows[rowIdx].code = isTurningOn ? code : "";

  // 코드 E 선택 시 특정 지명 없이 "Move to "만 자동 입력 후 커서 포커스
  if (isTurningOn && code === "E" && !currentRows[rowIdx].detail) {
    currentRows[rowIdx].detail = "Move to ";
  }

  autoSaveLocal();
  renderDayCards();

  if (isTurningOn && code === "E") {
    focusInputEnd(`detail_${rowIdx}`);
  }
}

function setCity(rowIdx, city) {
  currentRows[rowIdx].city = city;
  if (city === "BSTK" && !currentRows[rowIdx].code) {
    currentRows[rowIdx].code = "A";
  }
  autoSaveLocal();
  renderDayCards();
}

function setDetail(rowIdx, text) {
  currentRows[rowIdx].detail = text;
  autoSaveLocal();
  renderDayCards();
  if (text.endsWith(" ")) {
    focusInputEnd(`detail_${rowIdx}`);
  }
}

function focusInputEnd(elId) {
  const input = document.getElementById(elId);
  if (input) {
    input.focus();
    const len = input.value.length;
    input.setSelectionRange(len, len);
  }
}

function updateField(rowIdx, field, val) {
  currentRows[rowIdx][field] = val;
  updateFilledCount();
  autoSaveLocal();
}

function clearSingleRow(rowIdx) {
  currentRows[rowIdx].city = "";
  currentRows[rowIdx].code = "";
  currentRows[rowIdx].detail = "";
  autoSaveLocal();
  renderDayCards();
}

function expandDaySlots(dIdx) {
  for (let s = 0; s < 4; s++) {
    const el = document.getElementById(`slot_${dIdx * 4 + s}`);
    if (el && el.classList.contains("hidden")) {
      el.classList.remove("hidden");
      break;
    }
  }
}

function copyPreviousDay(dIdx) {
  const weekObj = getSelectedWeekObj();
  for (let s = 0; s < 4; s++) {
    const prev = currentRows[(dIdx - 1) * 4 + s];
    currentRows[dIdx * 4 + s] = {
      date: weekObj.days[dIdx],
      no: s + 1,
      city: prev.city,
      code: prev.code,
      detail: prev.detail
    };
  }
  autoSaveLocal();
  renderDayCards();
  showToast(currentLang === "ko" ? "전일 일정을 복사했습니다." : "Copied from previous day.");
}

function copyFromLastWeek() {
  const select = document.getElementById("weekSelector");
  const curIdx = select.selectedIndex;
  if (curIdx <= 0) return;

  const prevWeekKey = weekOptions[curIdx - 1].key;
  const prevCache = localStorage.getItem(`weekly_${prevWeekKey}`);
  if (!prevCache) {
    showToast(currentLang === "ko" ? "저장된 지난주 데이터가 없습니다." : "No data from last week.");
    return;
  }

  const parsed = JSON.parse(prevCache);
  const prevRows = parsed[currentUser.code];
  if (!prevRows) return;

  const weekObj = getSelectedWeekObj();
  currentRows = prevRows.map((r, i) => ({
    ...r,
    date: weekObj.days[Math.floor(i / 4)]
  }));
  autoSaveLocal();
  renderDayCards();
  showToast(currentLang === "ko" ? "지난주 일정을 불러왔습니다." : "Imported last week's plan.");
}

function clearMyWeek() {
  const weekObj = getSelectedWeekObj();
  currentRows = Array.from({ length: 20 }, (_, i) => ({
    date: weekObj.days[Math.floor(i / 4)],
    no: (i % 4) + 1,
    city: "",
    code: "",
    detail: ""
  }));
  autoSaveLocal();
  renderDayCards();
  showToast(currentLang === "ko" ? "현재 주차 일정을 비웠습니다." : "Cleared current week.");
}

function updateFilledCount() {
  const count = currentRows.filter(r => r.city || r.code || r.detail).length;
  document.getElementById("filledCountText").innerText = count;
}

async function saveMyData() {
  const weekObj = getSelectedWeekObj();
  allWeekData[currentUser.code] = currentRows;
  localStorage.setItem(`weekly_${weekObj.key}`, JSON.stringify(allWeekData));

  const btn = document.getElementById("btnSave");
  btn.disabled = true;
  btn.innerText = "Saving...";

  if (SCRIPT_URL && SCRIPT_URL.startsWith("http")) {
    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ week: weekObj.key, user: currentUser.code, rows: currentRows })
      });
    } catch (e) {
      console.error(e);
    }
  }

  btn.disabled = false;
  btn.innerText = I18N[currentLang].btnSave;
  renderSubmissionSummary();
  showToast(I18N[currentLang].savedToast);
}

// [탭 2] 6명 전체 매트릭스 렌더링
function renderMatrixView() {
  const weekObj = getSelectedWeekObj();
  document.getElementById("matrixPeriodSub").innerText = weekObj.periodStr;

  // 코드 필터 버튼
  const filterBar = document.getElementById("matrixCodeFilter");
  filterBar.innerHTML = `
    <button onclick="setMatrixFilter('ALL')"
      class="px-2.5 py-1 rounded-lg text-xs font-bold border ${matrixFilterCode === "ALL" ? "bg-slate-900 text-white border-slate-900" : "bg-white text-slate-600 border-slate-200"}">
      ${I18N[currentLang].filterAll}
    </button>
    ${ACTIVITY_CODES.map(c => `
      <button onclick="setMatrixFilter('${c.code}')"
        class="px-2 py-1 rounded-lg text-xs font-bold border ${matrixFilterCode === c.code ? c.color : "bg-white text-slate-600 border-slate-200 hover:bg-slate-50"}">
        ${c.code}
      </button>
    `).join("")}
  `;

  // 테이블 헤더 (Date + 6명)
  document.getElementById("matrixTableHead").innerHTML = `
    <th class="border-b border-r border-slate-200 p-2.5 w-24 text-center bg-slate-100 sticky left-0 z-10">Date</th>
    ${MEMBERS.map(m => {
      const rows = allWeekData[m.code] || [];
      const hasData = rows.some(r => r.city || r.code || r.detail);
      return `
        <th class="border-b border-r border-slate-200 p-2.5 text-left min-w-[145px]">
          <div class="flex items-center justify-between">
            <span class="font-extrabold text-slate-900">${m.ko}</span>
            <span class="text-[10px] px-1.5 py-0.5 rounded font-bold ${hasData ? "bg-emerald-100 text-emerald-700" : "bg-slate-200 text-slate-500"}">${m.code}</span>
          </div>
        </th>
      `;
    }).join("")}
  `;

  // 테이블 본문 (월~금 5행 x 6명 열)
  document.getElementById("matrixTableBody").innerHTML = weekObj.days.map((dayStr, dIdx) => {
    const memberCells = MEMBERS.map(m => {
      const rows = (allWeekData[m.code] || []).slice(dIdx * 4, dIdx * 4 + 4);
      const validRows = rows.filter(r => {
        const filled = r.city || r.code || r.detail;
        if (!filled) return false;
        if (matrixFilterCode !== "ALL" && r.code !== matrixFilterCode) return false;
        return true;
      });

      if (validRows.length === 0) {
        return `<td class="border-b border-r border-slate-200 p-2 align-top text-slate-300 text-center">-</td>`;
      }

      const itemsHtml = validRows.map(r => {
        const codeObj = ACTIVITY_CODES.find(c => c.code === r.code);
        const badgeClass = codeObj ? codeObj.light : "bg-slate-100 text-slate-600 border-slate-200";
        return `
          <div class="p-1.5 rounded-lg border ${badgeClass} mb-1.5 last:mb-0">
            <div class="flex items-center justify-between gap-1 mb-0.5">
              <span class="font-extrabold text-[10px]">${escapeHtml(r.code || "-")}</span>
              <span class="font-bold text-[10px] opacity-80 truncate">${escapeHtml(r.city)}</span>
            </div>
            <div class="text-[11px] leading-snug text-slate-800 break-words">${escapeHtml(r.detail)}</div>
          </div>
        `;
      }).join("");

      return `<td class="border-b border-r border-slate-200 p-2 align-top bg-white">${itemsHtml}</td>`;
    }).join("");

    return `
      <tr>
        <td class="border-b border-r border-slate-200 p-2.5 text-center font-extrabold text-slate-700 bg-slate-50 sticky left-0 align-top">
          ${dayStr}
        </td>
        ${memberCells}
      </tr>
    `;
  }).join("");
}

function setMatrixFilter(code) {
  matrixFilterCode = code;
  renderMatrixView();
}

// [탭 3] 개별 시트 보기
function renderOverviewTabs() {
  document.getElementById("sheetTabs").innerHTML = MEMBERS.map(m => {
    const hasData = (allWeekData[m.code] || []).some(r => r.city || r.code || r.detail);
    const active = selectedPreviewCode === m.code;
    return `
      <button onclick="selectPreviewSheet('${m.code}')"
        class="px-3 py-1.5 rounded-xl text-xs font-extrabold border transition flex items-center gap-1.5
        ${active ? "bg-slate-900 text-white border-slate-900" : "bg-white text-slate-700 border-slate-300 hover:bg-slate-100"}">
        <span>${m.code} (${m.ko})</span>
        <span class="w-2 h-2 rounded-full ${hasData ? "bg-emerald-400" : "bg-slate-300"}"></span>
      </button>
    `;
  }).join("");
  renderPreviewTable();
}

function selectPreviewSheet(code) {
  selectedPreviewCode = code;
  renderOverviewTabs();
}

function renderPreviewTable() {
  const weekObj = getSelectedWeekObj();
  const member = MEMBERS.find(m => m.code === selectedPreviewCode);
  const rows = allWeekData[selectedPreviewCode] || [];
  const hasData = rows.some(r => r.city || r.code || r.detail);

  document.getElementById("previewSheetHeader").innerText = `Sheet: ${member.code} (${member.en})`;
  const badge = document.getElementById("previewStatusBadge");
  badge.innerText = hasData ? I18N[currentLang].statusDone : I18N[currentLang].statusEmpty;
  badge.className = hasData
    ? "text-xs px-2.5 py-1 rounded-full font-bold bg-emerald-100 text-emerald-700"
    : "text-xs px-2.5 py-1 rounded-full font-bold bg-slate-200 text-slate-600";

  let html = "";
  weekObj.days.forEach((dayStr, dIdx) => {
    for (let no = 1; no <= 4; no++) {
      const idx = dIdx * 4 + (no - 1);
      const r = rows[idx] || { city: "", code: "", detail: "" };
      html += `<tr>`;
      if (no === 1) {
        html += `<td rowspan="4" class="border border-slate-300 p-2 text-center font-bold bg-slate-50">${dayStr}</td>`;
      }
      html += `
        <td class="border border-slate-300 p-1.5 text-center">${no}</td>
        <td class="border border-slate-300 p-1.5 text-center">${escapeHtml(r.city)}</td>
        <td class="border border-slate-300 p-1.5 text-center font-bold text-blue-700">${escapeHtml(r.code)}</td>
        <td class="border border-slate-300 p-1.5">${escapeHtml(r.detail)}</td>
      </tr>`;
    }
  });
  document.getElementById("previewTableBody").innerHTML = html;
}

// 6명 시트 통합 엑셀 다운로드
function downloadExcel() {
  const weekObj = getSelectedWeekObj();
  allWeekData[currentUser.code] = currentRows;
  const wb = XLSX.utils.book_new();

  MEMBERS.forEach(member => {
    const userRows = allWeekData[member.code] || [];
    const sheetData = [];

    sheetData.push(["Weekly Itinerary", "", "", "", "", ""]);
    sheetData.push(["Period", "", weekObj.periodStr, "", "Team", "Product Solution"]);
    sheetData.push([]);
    sheetData.push(["Date", "No.", "City", "Activity Code", "Activity / Details"]);

    weekObj.days.forEach((dayStr, dIdx) => {
      for (let no = 1; no <= 4; no++) {
        const idx = dIdx * 4 + (no - 1);
        const r = userRows[idx] || { city: "", code: "", detail: "" };
        sheetData.push([
          no === 1 ? dayStr : "",
          no,
          r.city,
          r.code,
          r.detail
        ]);
      }
    });

    sheetData.push([]);
    sheetData.push(["Activity Code", "", "", "", ""]);
    sheetData.push(["Activity", "", "", "Code", ""]);
    ACTIVITY_CODES.forEach(c => {
      sheetData.push([c.label, "", "", c.code, ""]);
    });

    const ws = XLSX.utils.aoa_to_sheet(sheetData);
    ws["!merges"] = [
      { s: { r: 0, c: 0 }, e: { r: 0, c: 4 } },
      { s: { r: 1, c: 0 }, e: { r: 1, c: 1 } },
      { s: { r: 4, c: 0 }, e: { r: 7, c: 0 } },
      { s: { r: 8, c: 0 }, e: { r: 11, c: 0 } },
      { s: { r: 12, c: 0 }, e: { r: 15, c: 0 } },
      { s: { r: 16, c: 0 }, e: { r: 19, c: 0 } },
      { s: { r: 20, c: 0 }, e: { r: 23, c: 0 } }
    ];
    ws["!cols"] = [
      { wch: 15 },
      { wch: 6 },
      { wch: 18 },
      { wch: 15 },
      { wch: 42 }
    ];

    XLSX.utils.book_append_sheet(wb, ws, member.code);
  });

  XLSX.writeFile(wb, `Weekly_Plan_${weekObj.key}.xlsx`);
  showToast(currentLang === "ko" ? "엑셀 파일이 다운로드되었습니다." : "Excel file downloaded.");
}
</script>
